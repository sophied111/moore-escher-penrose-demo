name: Deploy to Hugging Face Space
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install hf CLI
        run: pip install -U huggingface_hub
      - name: Upload to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf upload SophieD/moore-escher-penrose-demo . \
            --repo-type space \
            --exclude "**/__pycache__/**" \
            --exclude ".git/**" \
            --exclude "tests/**" \
            --exclude ".github/**" \
            --token "$HF_TOKEN"
